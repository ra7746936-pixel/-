<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مخزني</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <h1>مخزني</h1>
      <span id="sync" class="chip">بيحمّل…</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="الشاشات">
      <button class="tab" role="tab" data-tab="sell" id="t-sell">البيع</button>
      <button class="tab" role="tab" data-tab="stock" id="t-stock">المخزن</button>
      <button class="tab" role="tab" data-tab="report" id="t-report">التقرير</button>
    </nav>
  </header>

  <main>
    <section id="v-sell" aria-labelledby="t-sell">
      <div class="sell-grid">
        <div class="panel">
          <h2>الأصناف</h2>
          <label class="sr" for="q">دوّر على صنف</label>
          <input id="q" type="search" placeholder="دوّر على صنف…" autocomplete="off">
          <ul id="plist" class="plist"></ul>
        </div>
        <div class="panel cart">
          <h2>الفاتورة</h2>
          <ul id="cart" class="clist"></ul>
          <div class="total"><span>الإجمالي</span><strong id="total">0 ج.م</strong></div>
          <button id="checkout" class="btn primary big" type="button">تأكيد البيع</button>
        </div>
      </div>
    </section>

    <section id="v-stock" aria-labelledby="t-stock" hidden>
      <div class="panel">
        <h2 id="f-title">إضافة صنف</h2>
        <form id="pform" class="pform" autocomplete="off">
          <div class="wide">
            <label for="f-name">اسم الصنف</label>
            <input id="f-name" type="text" placeholder=" هنضيف اي">
          </div>
          <div>
            <label for="f-price">سعر البيع (ج.م)</label>
            <input id="f-price" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
          </div>
          <div>
            <label for="f-qty" id="f-qty-label">الكمية</label>
            <input id="f-qty" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
          </div>
          <div class="actions">
            <button class="btn primary" id="f-submit" type="submit">إضافة للمخزن</button>
            <button class="btn ghost" id="f-cancel" type="button" hidden>إلغاء</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>الأصناف اللي في المخزن</h2>
        <ul id="slist" class="slist"></ul>
      </div>
    </section>

    <section id="v-report" aria-labelledby="t-report" hidden>
      <div class="seg" role="group" aria-label="الفترة">
        <button type="button" data-period="today" aria-pressed="true">النهارده</button>
        <button type="button" data-period="all" aria-pressed="false">من الأول</button>
      </div>
      <div id="tiles" class="tiles"></div>
      <div class="panel">
        <h2>كل صنف: اتباع كام وفاضل كام</h2>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>الصنف</th><th class="n">اتباع</th><th class="n">فاضل</th><th class="n">الإيراد</th></tr></thead>
            <tbody id="rtable"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h2>آخر الفواتير</h2>
        <ul id="recent" class="recent"></ul>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  document.documentElement.setAttribute('dir','rtl');
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var fmt = function(n){ return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}); };
  var money = function(n){ return fmt(n)+' ج.م'; };
  var round = function(n){ return Math.round(n*1000)/1000; };
  var uid = function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); };
  var byName = function(a,b){ return a.name.localeCompare(b.name,'ar'); };
  var LOW = 5;

  var products = new Map();
  var sales = [];
  var cart = {};
  var view = 'sell';
  var period = 'today';
  var editingId = null;
  var pendingDel = null, delTimer = null;
  var mode = 'pending';
  var db = null;

  /* ---------- حفظ ---------- */
  var LS_KEY = 'makhzani-v1';
  function lsLoad(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(raw){
        var d = JSON.parse(raw);
        (d.products||[]).forEach(function(p){ products.set(p.id,p); });
        sales = d.sales||[];
      }
    }catch(e){}
  }
  function lsSave(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({products:Array.from(products.values()),sales:sales})); }catch(e){}
  }
  var chain = Promise.resolve();
  function enqueue(fn){
    chain = chain.then(fn).catch(function(e){ toast('الحفظ ماتمش: '+((e&&e.message)||'جرب تاني'),true); });
    return chain;
  }
  function persist(dbFn){
    if(mode==='db') enqueue(dbFn); else lsSave();
    render();
  }
  function ready(){
    if(mode==='pending'){ toast('استنى ثواني لحد ما البيانات تتحمّل',true); return false; }
    return true;
  }
  function putProduct(p){
    products.set(p.id,p);
    persist(function(){ return db.doc('products/'+p.id).set(p); });
  }
  function removeProduct(id){
    products.delete(id);
    persist(function(){ return db.doc('products/'+id).delete(); });
  }
  function recordSale(sale,updated){
    updated.forEach(function(p){ products.set(p.id,p); });
    sales.unshift(sale);
    persist(async function(){
      for(var i=0;i<updated.length;i++){ await db.doc('products/'+updated[i].id).set(updated[i]); }
      await db.doc('sales/'+sale.id).set(sale);
    });
  }

  /* ---------- رسالة سريعة ---------- */
  var tt;
  function toast(msg,bad){
    var el = $('#toast');
    el.textContent = msg;
    el.className = 'toast show'+(bad?' bad':'');
    clearTimeout(tt);
    tt = setTimeout(function(){ el.className='toast'; },2600);
  }

  /* ---------- رسم ---------- */
  function render(){ renderStatus(); renderTabs(); renderSell(); renderStock(); renderReport(); }

  function renderStatus(){
    var el = $('#sync');
    if(mode==='db'){ el.textContent='محفوظ ومتزامن'; el.className='chip db'; }
    else if(mode==='local'){ el.textContent='محفوظ على الجهاز ده بس'; el.className='chip local'; }
    else { el.textContent='بيحمّل…'; el.className='chip'; }
  }

  function renderTabs(){
    ['sell','stock','report'].forEach(function(v){
      $('#v-'+v).hidden = (v!==view);
      $('#t-'+v).setAttribute('aria-selected', v===view ? 'true':'false');
    });
    document.querySelectorAll('[data-period]').forEach(function(b){
      b.setAttribute('aria-pressed', b.dataset.period===period ? 'true':'false');
    });
  }

  function cleanCart(){
    Object.keys(cart).forEach(function(id){
      var p = products.get(id);
      if(!p || p.qty<=0){ delete cart[id]; return; }
      if(cart[id]>p.qty) cart[id]=p.qty;
      if(!(cart[id]>0)) delete cart[id];
    });
  }

  function renderSell(){
    var q = ($('#q').value||'').trim().toLowerCase();
    var list = Array.from(products.values()).filter(function(p){ return !q || p.name.toLowerCase().indexOf(q)>=0; }).sort(byName);
    $('#plist').innerHTML = list.length ? list.map(function(p){
      return '<li><button type="button" class="prow" data-act="add" data-id="'+esc(p.id)+'"'+(p.qty<=0?' disabled':'')+'>'+
        '<span class="pname">'+esc(p.name)+'</span>'+
        '<span class="pmeta">'+money(p.price)+' · '+(p.qty<=0?'خلص':'فاضل '+fmt(p.qty))+'</span>'+
        '<span class="padd" aria-hidden="true">+</span></button></li>';
    }).join('') : '<li class="note">'+(products.size ? 'مفيش صنف بالاسم ده.' : 'لسه مفيش أصناف. افتح «المخزن» وضيف أول صنف.')+'</li>';

    cleanCart();
    var ids = Object.keys(cart), total = 0;
    $('#cart').innerHTML = ids.length ? ids.map(function(id){
      var p = products.get(id), q2 = cart[id], sub = q2*p.price; total += sub;
      return '<li class="cline"><div class="cl-name">'+esc(p.name)+'<small>'+fmt(p.price)+' × '+fmt(q2)+' = '+money(sub)+'</small></div>'+
        '<div class="step"><button type="button" data-act="dec" data-id="'+esc(id)+'" aria-label="نقّص">−</button>'+
        '<input type="number" inputmode="decimal" min="0" step="any" value="'+q2+'" data-qty="'+esc(id)+'" aria-label="الكمية">'+
        '<button type="button" data-act="inc" data-id="'+esc(id)+'" aria-label="زوّد">+</button></div>'+
        '<button type="button" class="rm" data-act="rm" data-id="'+esc(id)+'" aria-label="شيل من الفاتورة">×</button></li>';
    }).join('') : '<li class="note">اضغط على الأصناف اللي عايز تبيعها.</li>';
    $('#total').textContent = money(total);
    $('#checkout').disabled = !ids.length;
  }

  function statusOf(p){
    if(p.qty<=0) return '<span class="pill bad">خلص</span>';
    if(p.qty<=LOW) return '<span class="pill warn">قرب يخلص</span>';
    return '<span class="pill ok">متوفر</span>';
  }

  function renderStock(){
    var list = Array.from(products.values()).sort(byName);
    var box = $('#slist');
    if(!list.length){
      box.innerHTML = '<li class="empty"><p>لسه مفيش أصناف في المخزن.</p><div class="row">'+
        '<button type="button" class="btn primary" data-act="focusform">ضيف أول صنف</button>'+
        '<button type="button" class="btn" data-act="seed">جرّب بأصناف تجريبية</button></div></li>';
      return;
    }
    box.innerHTML = list.map(function(p){
      var del = pendingDel===p.id;
      return '<li class="item"><div class="item-head"><strong>'+esc(p.name)+'</strong>'+statusOf(p)+'</div>'+
        '<dl class="stats"><div><dt>السعر</dt><dd>'+money(p.price)+'</dd></div>'+
        '<div><dt>اتباع</dt><dd>'+fmt(p.sold)+'</dd></div>'+
        '<div><dt>فاضل</dt><dd>'+fmt(p.qty)+'</dd></div></dl>'+
        '<div class="item-actions">'+
        '<form class="restock" data-id="'+esc(p.id)+'"><input name="n" type="number" inputmode="decimal" min="0" step="any" placeholder="كمية جديدة" aria-label="كمية التوريد لـ '+esc(p.name)+'"><button class="btn" type="submit">+ توريد</button></form>'+
        '<button type="button" class="btn" data-act="edit" data-id="'+esc(p.id)+'">تعديل</button>'+
        '<button type="button" class="btn danger" data-act="del" data-id="'+esc(p.id)+'">'+(del?'متأكد؟ اضغط تاني':'حذف')+'</button>'+
        '</div></li>';
    }).join('');
  }

  function periodRows(){
    var t0 = new Date(); t0.setHours(0,0,0,0); t0 = t0.getTime();
    var rows = new Map(), invoices = 0;
    if(period==='today'){
      sales.filter(function(s){ return s.ts>=t0; }).forEach(function(s){
        invoices++;
        s.lines.forEach(function(l){
          var r = rows.get(l.pid) || {name:l.name,sold:0,rev:0};
          r.sold += l.qty; r.rev += l.qty*l.price; rows.set(l.pid,r);
        });
      });
    } else {
      products.forEach(function(p){ rows.set(p.id,{name:p.name,sold:p.sold||0,rev:p.revenue||0}); });
    }
    products.forEach(function(p){ if(!rows.has(p.id)) rows.set(p.id,{name:p.name,sold:0,rev:0}); });
    var out = [];
    rows.forEach(function(r,pid){ var p = products.get(pid); out.push({name:r.name,sold:r.sold,rev:r.rev,left:p?p.qty:null}); });
    out.sort(function(a,b){ return (b.sold-a.sold) || a.name.localeCompare(b.name,'ar'); });
    return {rows:out,invoices:invoices,t0:t0};
  }

  function renderReport(){
    var r = periodRows();
    var rev = 0, pcs = 0, stockVal = 0;
    r.rows.forEach(function(x){ rev += x.rev; pcs += x.sold; });
    products.forEach(function(p){ stockVal += p.qty*p.price; });
    $('#tiles').innerHTML =
      '<div class="tile"><span>مبيعات '+(period==='today'?'النهارده':'من الأول')+'</span><strong>'+money(rev)+'</strong>'+(period==='today'?'<small>'+fmt(r.invoices)+' فاتورة</small>':'')+'</div>'+
      '<div class="tile"><span>قطع اتباعت</span><strong>'+fmt(pcs)+'</strong></div>'+
      '<div class="tile"><span>قيمة اللي فاضل في المخزن</span><strong>'+money(stockVal)+'</strong></div>';
    $('#rtable').innerHTML = r.rows.length ? r.rows.map(function(x){
      return '<tr><td>'+esc(x.name)+'</td><td class="n">'+fmt(x.sold)+'</td><td class="n">'+(x.left===null?'—':fmt(x.left))+'</td><td class="n">'+money(x.rev)+'</td></tr>';
    }).join('') : '<tr><td colspan="4" class="note">مفيش أصناف لسه.</td></tr>';
    var recent = sales.filter(function(s){ return period==='all' || s.ts>=r.t0; }).slice(0,15);
    $('#recent').innerHTML = recent.length ? recent.map(function(s){
      var when = new Date(s.ts).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
      return '<li><span class="when">'+when+'</span><span class="what">'+s.lines.map(function(l){ return esc(l.name)+' ×'+fmt(l.qty); }).join('، ')+'</span><span class="sum">'+money(s.total)+'</span></li>';
    }).join('') : '<li class="note">مفيش فواتير في الفترة دي.</li>';
  }

  /* ---------- البيع ---------- */
  function confirmSale(){
    if(!ready()) return;
    var lines = [], updated = [], total = 0, bad = null;
    Object.keys(cart).forEach(function(pid){
      var p = products.get(pid), q = cart[pid];
      if(!p || !(q>0)) return;
      if(q>p.qty){ bad = p; return; }
      lines.push({pid:pid,name:p.name,qty:q,price:p.price});
      total += q*p.price;
      updated.push(Object.assign({},p,{qty:round(p.qty-q),sold:round((p.sold||0)+q),revenue:round((p.revenue||0)+q*p.price)}));
    });
    if(bad){ toast('المتاح من '+bad.name+' '+fmt(bad.qty)+' بس',true); return; }
    if(!lines.length) return;
    var sale = {id:uid(),ts:Date.now(),lines:lines,total:round(total)};
    cart = {};
    recordSale(sale,updated);
    toast('تم البيع: '+money(total));
  }

  /* ---------- المخزن ---------- */
  function resetForm(){
    $('#pform').reset();
    editingId = null;
    $('#f-title').textContent = 'إضافة صنف';
    $('#f-submit').textContent = 'إضافة للمخزن';
    $('#f-qty-label').textContent = 'الكمية';
    $('#f-cancel').hidden = true;
  }

  function seedExamples(){
    if(!ready()) return;
    [['أرز 1 كجم',38,40],['سكر 1 كجم',32,30],['زيت 1 لتر',85,24],['شاي 100 جم',28,3],['مكرونة 400 جم',12,60]].forEach(function(x){
      putProduct({id:uid(),name:x[0],price:x[1],qty:x[2],sold:0,revenue:0,created:Date.now()});
    });
    toast('اتضافت 5 أصناف تجريبية. تقدر تمسحها من هنا.');
  }

  /* ---------- أحداث ---------- */
  document.addEventListener('click',function(e){
    var tab = e.target.closest('[data-tab]');
    if(tab){ view = tab.dataset.tab; render(); return; }
    var per = e.target.closest('[data-period]');
    if(per){ period = per.dataset.period; render(); return; }
    var btn = e.target.closest('[data-act]');
    if(!btn) return;
    var id = btn.dataset.id, p = id ? products.get(id) : null;
    switch(btn.dataset.act){
      case 'add': {
        if(!p || p.qty<=0) return;
        var cur = cart[id]||0, next = round(Math.min(cur+1,p.qty));
        if(next===cur){ toast('وصلت لآخر كمية متاحة من '+p.name,true); return; }
        cart[id] = next; renderSell(); break;
      }
      case 'inc': {
        if(!p) return;
        var c2 = cart[id]||0, n2 = round(Math.min(c2+1,p.qty));
        if(n2===c2){ toast('وصلت لآخر كمية متاحة من '+p.name,true); return; }
        cart[id] = n2; renderSell(); break;
      }
      case 'dec': {
        var c3 = round((cart[id]||0)-1);
        if(c3>0) cart[id]=c3; else delete cart[id];
        renderSell(); break;
      }
      case 'rm': delete cart[id]; renderSell(); break;
      case 'edit': {
        if(!p) return;
        editingId = id;
        $('#f-name').value = p.name; $('#f-price').value = p.price; $('#f-qty').value = p.qty;
        $('#f-title').textContent = 'تعديل الصنف';
        $('#f-submit').textContent = 'حفظ التعديل';
        $('#f-qty-label').textContent = 'الفاضل دلوقتي';
        $('#f-cancel').hidden = false;
        $('#pform').scrollIntoView({block:'center'});
        $('#f-name').focus();
        break;
      }
      case 'del': {
        if(pendingDel===id){
          clearTimeout(delTimer); pendingDel = null;
          if(!ready()) return;
          if(editingId===id) resetForm();
          removeProduct(id); toast('اتمسح الصنف');
        } else {
          pendingDel = id; clearTimeout(delTimer);
          delTimer = setTimeout(function(){ pendingDel=null; renderStock(); },3000);
          renderStock();
        }
        break;
      }
      case 'seed': seedExamples(); break;
      case 'focusform': $('#f-name').focus(); break;
    }
  });

  $('#checkout').addEventListener('click',confirmSale);
  $('#q').addEventListener('input',renderSell);
  $('#f-cancel').addEventListener('click',resetForm);

  $('#cart').addEventListener('change',function(e){
    var inp = e.target.closest('[data-qty]');
    if(!inp) return;
    var id = inp.dataset.qty, p = products.get(id), v = parseFloat(inp.value);
    if(!p) return;
    if(!(v>0)){ delete cart[id]; }
    else if(v>p.qty){ cart[id]=p.qty; toast('المتاح من '+p.name+' '+fmt(p.qty)+' بس',true); }
    else cart[id]=round(v);
    renderSell();
  });

  $('#pform').addEventListener('submit',function(e){
    e.preventDefault();
    if(!ready()) return;
    var name = $('#f-name').value.trim();
    var price = parseFloat($('#f-price').value);
    var qty = parseFloat($('#f-qty').value);
    if(!name){ toast('اكتب اسم الصنف',true); $('#f-name').focus(); return; }
    if(!(price>=0)){ toast('اكتب سعر البيع',true); $('#f-price').focus(); return; }
    if(!(qty>=0)){ toast('اكتب الكمية',true); $('#f-qty').focus(); return; }
    var old = editingId ? products.get(editingId) : null;
    if(old){
      putProduct(Object.assign({},old,{name:name,price:round(price),qty:round(qty)}));
      toast('اتعدّل: '+name);
    } else {
      putProduct({id:uid(),name:name,price:round(price),qty:round(qty),sold:0,revenue:0,created:Date.now()});
      toast('اتضاف: '+name);
    }
    resetForm();
    $('#f-name').focus();
  });

  $('#slist').addEventListener('submit',function(e){
    var f = e.target.closest('form.restock');
    if(!f) return;
    e.preventDefault();
    if(!ready()) return;
    var p = products.get(f.dataset.id), n = parseFloat(f.elements.n.value);
    if(!p || !(n>0)){ toast('اكتب كمية التوريد',true); return; }
    putProduct(Object.assign({},p,{qty:round(p.qty+n)}));
    toast('اتزوّد '+fmt(n)+' من '+p.name);
  });

  /* ---------- بداية ---------- */
  render();
  (async function init(){
    var c = null;
    try{ c = window.claude ? await window.claude.use('db') : null; }catch(e){ c = null; }
    if(c){
      db = c; mode = 'db';
      var fail = function(err){ toast('مشكلة في الاتصال بالبيانات: '+((err&&err.message)||''),true); };
      db.collection('products').onSnapshot(function(snap){
        var m = new Map();
        snap.docs.forEach(function(d){ var v = d.data(); if(v) m.set(d.id,Object.assign({},v,{id:d.id})); });
        products = m; render();
      },fail);
      db.collection('sales').orderBy('ts','desc').limit(1000).onSnapshot(function(snap){
        sales = snap.docs.map(function(d){ return Object.assign({},d.data(),{id:d.id}); });
        render();
      },fail);
    } else {
      mode = 'local'; lsLoad();
    }
    render();
  })();
})();
</script>
</body>
</html>
