<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مخزني</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<script>
window.onerror=function(m){ window.__err=m; };
setTimeout(function(){
  var s=document.getElementById('sync');
  if(s && s.textContent.indexOf('بيحمّل')>-1){
    var d=document.createElement('div');
    d.style.cssText='background:#8F2A1F;color:#fff;padding:12px;margin:8px;border-radius:8px;font-size:14px';
    d.textContent='البرنامج مش شغال. جرّب تفتح الملف بمتصفح Chrome، وتأكد إن الكود اتنسخ كله.'+(window.__err?' (الخطأ: '+window.__err+')':'');
    document.body.insertBefore(d,document.body.firstChild);
  }
},4000);
</script>
</head>
<body>
<div class="wrap" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <h1>مخزني</h1>
      <span id="sync" class="chip">بيحمّل…</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="الشاشات">
      <button class="tab" role="tab" data-tab="sell" id="t-sell">البيع</button>
      <button class="tab" role="tab" data-tab="stock" id="t-stock">المخزن</button>
      <button class="tab" role="tab" data-tab="sup" id="t-sup">الموردين</button>
      <button class="tab" role="tab" data-tab="report" id="t-report">التقرير</button>
    </nav>
  </header>

  <main>
    <section id="v-sell" aria-labelledby="t-sell">
      <div class="sell-grid">
        <div class="panel">
          <h2>الأصناف</h2>
          <label class="sr" for="q">دوّر على صنف</label>
          <input id="q" type="search" placeholder="دوّر على صنف…" autocomplete="off">
          <ul id="plist" class="plist"></ul>
        </div>
        <div class="panel cart">
          <h2>الفاتورة</h2>
          <ul id="cart" class="clist"></ul>
          <div class="total"><span>الإجمالي</span><strong id="total">0 ج.م</strong></div>
          <button id="checkout" class="btn primary big" type="button">تأكيد البيع</button>
        </div>
      </div>
    </section>

    <section id="v-stock" aria-labelledby="t-stock" hidden>
      <div class="panel">
        <h2 id="f-title">إضافة صنف</h2>
        <form id="pform" class="pform" autocomplete="off">
          <div class="wide">
            <label for="f-name">اسم الصنف</label>
            <input id="f-name" type="text" placeholder="مثلا: أرز 1 كجم">
          </div>
          <div>
            <label for="f-price">سعر البيع (ج.م)</label>
            <input id="f-price" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
          </div>
          <div>
            <label for="f-cost">سعر الجملة (اختياري)</label>
            <input id="f-cost" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
          </div>
          <div>
            <label for="f-qty" id="f-qty-label">الكمية</label>
            <input id="f-qty" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
          </div>
          <div class="actions">
            <button class="btn primary" id="f-submit" type="submit">إضافة للمخزن</button>
            <button class="btn ghost" id="f-cancel" type="button" hidden>إلغاء</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>الأصناف اللي في المخزن</h2>
        <ul id="slist" class="slist"></ul>
      </div>
      <div class="panel" id="backup" hidden>
        <h2>نسخة احتياطية</h2>
        <p class="hint" id="b-last">لسه ماعملتش نسخة احتياطية.</p>
        <div class="row-actions">
          <button class="btn primary" id="b-export" type="button">حمّل نسخة احتياطية</button>
          <button class="btn" id="b-import" type="button">استرجع من ملف</button>
          <input id="b-file" type="file" accept="application/json,.json" hidden>
        </div>
        <div id="b-confirm" class="b-confirm" hidden>
          <p id="b-msg"></p>
          <div class="row-actions">
            <button class="btn danger" id="b-yes" type="button">استرجع واستبدل البيانات</button>
            <button class="btn ghost" id="b-no" type="button">إلغاء</button>
          </div>
        </div>
      </div>
    </section>

    <section id="v-sup" aria-labelledby="t-sup" hidden>
      <div id="sup-list-view">
        <div class="panel">
          <h2>إضافة مورد</h2>
          <form id="sform" class="pform" autocomplete="off">
            <div class="wide">
              <label for="s-name">اسم المورد</label>
              <input id="s-name" type="text" placeholder="مثلا: شركة النور">
            </div>
            <div>
              <label for="s-phone">التليفون (اختياري)</label>
              <input id="s-phone" type="text" inputmode="tel" placeholder="01xxxxxxxxx">
            </div>
            <div class="actions">
              <button class="btn primary" type="submit">إضافة المورد</button>
            </div>
          </form>
        </div>
        <div class="panel">
          <h2>الموردين</h2>
          <ul id="suplist" class="slist"></ul>
        </div>
      </div>

      <div id="sup-detail" hidden>
        <button class="btn ghost back" id="sd-back" type="button" data-act="supback">← كل الموردين</button>
        <div class="panel">
          <div class="sd-head">
            <h2 id="sd-name"></h2>
            <span id="sd-pill" class="pill zero"></span>
          </div>
          <p class="hint" id="sd-phone"></p>
          <div id
